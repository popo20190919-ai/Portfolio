 if(kind==='yellow'){x.fillStyle='#ffe100';x.fillRect(0,0,512,512);x.fillStyle='#111';x.font='700 92px Arial';x.fillText('3',35,105);x.font='700 38px Arial';x.fillText('KM',120,74);x.fillStyle='#fff';x.beginPath();x.ellipse(270,320,92,130,-.2,0,Math.PI*2);x.ellipse(330,210,50,120,.5,0,Math.PI*2);x.fill();x.fillStyle='#ff7530';x.fillRect(0,455,512,57);x.strokeStyle='#fff';x.lineWidth=24;for(let i=-40;i<560;i+=82){x.beginPath();x.moveTo(i,512);x.lineTo(i+35,455);x.stroke()}}
 if(kind==='blue'){x.fillStyle='#314df4';x.fillRect(0,0,512,512);x.fillStyle='#fff';x.beginPath();x.roundRect(62,72,388,368,36);x.fill();x.fillStyle='#314df4';x.fillRect(95,155,320,170);x.strokeStyle='#fff';x.lineWidth=48;x.beginPath();x.moveTo(75,130);x.lineTo(430,390);x.moveTo(430,130);x.lineTo(75,390);x.stroke()}
 if(kind==='geometry'){x.fillStyle='#0877d7';x.fillRect(0,0,512,512);x.fillStyle='#ffff2d';x.beginPath();x.moveTo(48,110);x.lineTo(290,256);x.lineTo(48,402);x.fill();circle('#fff',370,256,65);x.fillStyle='#ff7738';x.fillRect(450,100,45,312)}
 if(kind==='safe'){x.fillStyle='#ef2b0c';x.fillRect(0,0,512,512);x.strokeStyle='#fff';x.lineWidth=22;x.strokeRect(38,38,436,436);x.fillStyle='#fff';x.font='500 110px Arial';x.textAlign='center';x.fillText('SAFE',256,300)}
 if(kind==='fire'){x.fillStyle='#ff2e32';x.fillRect(0,0,512,512);x.strokeStyle='#fff';x.lineWidth=34;x.beginPath();x.arc(256,256,188,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.beginPath();x.moveTo(260,400);x.bezierCurveTo(120,360,175,230,220,185);x.lineTo(190,85);x.bezierCurveTo(315,160,260,220,325,265);x.bezierCurveTo(380,335,340,400,260,400);x.fill();x.strokeStyle='#ff2e32';x.lineWidth=28;x.beginPath();x.moveTo(140,100);x.lineTo(385,410);x.stroke()}
 if(kind==='alert'){x.fillStyle='#22cd29';x.fillRect(0,0,512,512);x.fillStyle='#0c4c24';x.beginPath();x.moveTo(256,72);x.lineTo(450,420);x.lineTo(62,420);x.closePath();x.fill();x.fillStyle='#fff';x.font='700 240px Arial';x.textAlign='center';x.fillText('!',256,385)}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

const imageLoader=new THREE.TextureLoader();
function imageMap(name){const t=imageLoader.load('./signpost/textures/'+name+'.png');t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function faceGeo(s,b=s.uv){const g=new THREE.ShapeGeometry(shapeFor(s.shape,s.w,s.h),48),p=g.attributes.position,u=g.attributes.uv;for(let i=0;i<p.count;i++){const nx=p.getX(i)/s.w+.5,ny=p.getY(i)/s.h+.5;if(b){const t=(ny+(b.pad||0))/(1+(b.pad||0));u.setXY(i,b.u0+nx*(b.u1-b.u0),b.v0+t*(b.v1-b.v0))}else u.setXY(i,nx,ny)}u.needsUpdate=true;return g}

const clickables=[];
signs.forEach((s,i)=>{
  const arm=new THREE.Group();arm.position.y=s.y;arm.rotation.y=s.angle;rig.add(arm);
  const dir=s.side||1,len=s.side===0?.3:(s.w*.56+.28);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,len,10),petioleMat);
  bar.rotation.z=Math.PI/2;bar.position.x=s.side===0?0:dir*(len/2+.08);arm.add(bar);
  const bud=budLeaf();bud.position.set(dir*.14,.08,0);bud.rotation.z=dir>0?-.6:Math.PI+.6;arm.add(bud);
  const sign=new THREE.Group();sign.position.x=s.side===0?0:dir*(len+.08);sign.rotation.y=s.showFront?0:Math.PI;arm.add(sign);
  const edge=(s.shape==='circle'||s.shape==='octagon')?s.w*.44:s.w*.46;
  const berry=new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),berryMat);
  berry.position.x=s.side===0?0:dir*(len+.08-edge);arm.add(berry);
  const rimGeo=new THREE.ExtrudeGeometry(shapeFor(s.shape,s.w,s.h,.055),{depth:.12,bevelEnabled:true,bevelSize:.025,bevelThickness:.025,bevelSegments:4,curveSegments:48});rimGeo.center();
  const rim=new THREE.Mesh(rimGeo,leafEdgeMat);sign.add(rim);
  const bodyGeo=new THREE.ExtrudeGeometry(shapeFor(s.shape,s.w,s.h),{depth:.14,bevelEnabled:true,bevelSize:.018,bevelThickness:.018,bevelSegments:3,curveSegments:48});bodyGeo.center();
  const body=new THREE.Mesh(bodyGeo,leafMat);sign.add(body);
  const kind=s.front==='01-top'?'cyan':s.front.slice(3);
  const front=new THREE.Mesh(faceGeo(s,null),new THREE.MeshStandardMaterial({map:tex(kind),transparent:true,alphaTest:.02,roughness:.9,metalness:0}));
  front.position.z=.092;front.scale.setScalar(s.shape==='triangle'?1.07:1.02);sign.add(front);
  const back=new THREE.Mesh(faceGeo(s,null),new THREE.MeshStandardMaterial({map:tex('leaf'),roughness:.95,metalness:0}));
  back.position.z=-.092;back.rotation.y=Math.PI;back.scale.setScalar(1.08);sign.add(back);
  [rim,body,front,back].forEach(o=>{o.userData.sign=sign;o.userData.idx=i;clickables.push(o)});
});

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;
controls.target.set(0,.22,0);
controls.minDistance=10;controls.maxDistance=34;
controls.minPolarAngle=controls.maxPolarAngle=Math.PI/2;
controls.update();

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let down={x:0,y:0},focus=null,anim=null,saved=null,mode='idle';
const panel=document.getElementById('detailPanel'),pTitle=document.getElementById('dTitle'),pMeta=document.getElementById('dMeta'),pBody=document.getElementById('dBody');
const ease=t=>1-Math.pow(1-t,3);
const state=()=>({cam:camera.position.clone(),target:controls.target.clone(),rig:rig.position.clone()});
function tween(to,done){const from=state(),start=performance.now();anim={step(now){const t=Math.min(1,(now-start)/850),e=ease(t);camera.position.lerpVectors(from.cam,to.cam,e);controls.target.lerpVectors(from.target,to.target,e);rig.position.lerpVectors(from.rig,to.rig,e);camera.lookAt(controls.target);if(t===1){anim=null;done?.()}}}}
function signFrame(sign,dist,rightShift,targetShift){
  const center=new THREE.Vector3();sign.getWorldPosition(center);
  const normal=new THREE.Vector3(0,0,1).applyQuaternion(sign.getWorldQuaternion(new THREE.Quaternion())).normalize();
  const right=new THREE.Vector3().crossVectors(normal,camera.up).negate().normalize();
  const cam=center.clone().addScaledVector(normal,dist).addScaledVector(right,rightShift);
  cam.y=center.y+0.05;
  const target=center.clone().addScaledVector(right,targetShift);
  return{cam,target};
}
function fillPanel(idx){
  const d=details[idx]||details[0];
  pTitle.textContent=d.t;
  pMeta.textContent=d.m;
  pBody.innerHTML=d.b.map(x=>`<p class="db">• ${x}</p>`).join('');
}
function enterDetail(idx,sign){
  if(mode==='idle')saved=state();
  focus=sign;mode='detail';controls.enabled=false;
  fillPanel(idx);
  const dir=signs[idx].side<0?-1:1;
  panel.classList.toggle('side-l',dir<0);
  panel.classList.toggle('side-r',dir>0);
  document.body.classList.add('detail-on');
  const{cam,target}=signFrame(sign,dir<0?5.35:4.9,(dir<0?0.32:0.55)*dir,(dir<0?0.95:1.3)*dir);
  tween({cam,target,rig:rig.position.clone()});
}
function restore(){
  if(!focus||!saved)return;
  const to=saved;focus=null;mode='idle';
  document.body.classList.remove('detail-on');
  tween(to,()=>{controls.enabled=true;controls.update();saved=null});
}
function pickAt(cx,cy){
  pointer.x=cx/innerWidth*2-1;pointer.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(clickables,false)[0];
}

renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>7||anim)return;
  const hit=pickAt(e.clientX,e.clientY);
  if(hit)enterDetail(hit.object.userData.idx,hit.object.userData.sign);
  else if(mode==='detail')restore();
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  fitBoard();
});

const board=document.querySelector('.board');
function fitBoard(){const s=Math.min(innerWidth/1920,1);board.style.transform=`translateX(-50%) scale(${s})`}
fitBoard();

function loop(now){requestAnimationFrame(loop);if(anim)anim.step(now);else controls.update();renderer.render(scene,camera)}
requestAnimationFrame(loop);
</script>
</body>
</html>
