 if(kind==='arrowLeaf'){x.fillStyle='#f2ff2b';x.fillRect(0,0,512,512);x.strokeStyle='#356b3f';x.lineCap='round';x.lineWidth=34;x.beginPath();x.moveTo(120,300);x.lineTo(350,300);x.stroke();x.fillStyle='#356b3f';x.beginPath();x.moveTo(352,210);x.lineTo(452,300);x.lineTo(352,390);x.closePath();x.fill()}
 if(kind==='redStar'){x.fillStyle='#ff3236';x.fillRect(0,0,512,512);x.fillStyle='#12632c';x.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,r=i%2?44:128;const px=256+Math.cos(a)*r,py=256+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill()}
 if(kind==='cyan'){rect('#43d5ee',0,0,512,512,34);x.fillStyle='#08bde9';x.fillRect(72,70,62,62);x.fillRect(225,70,62,62);x.fillRect(378,70,62,62);x.fillRect(72,164,368,205);x.fillRect(72,400,62,62);x.fillRect(225,400,62,62);x.fillRect(378,400,62,62)}
 if(kind==='arrow'){rect('#ffdf00',0,0,512,512,30);x.fillStyle='#111';x.fillRect(130,224,315,64);x.beginPath();x.moveTo(58,256);x.lineTo(165,177);x.lineTo(165,335);x.closePath();x.fill()}
 if(kind==='orange'){rect('#fff',0,0,512,512,30);x.strokeStyle='#ff7330';x.lineWidth=20;x.beginPath();x.roundRect(24,24,464,464,22);x.stroke();x.fillStyle='#ff7330';x.beginPath();x.moveTo(148,325);x.bezierCurveTo(80,170,188,135,247,174);x.bezierCurveTo(330,70,355,135,354,220);x.bezierCurveTo(430,165,470,245,418,331);x.bezierCurveTo(360,407,214,394,148,325);x.fill()}
 if(kind==='green'){x.fillStyle='#009e4f';x.fillRect(0,0,512,512);circle('#ffff28',256,286,90);x.fillStyle='#ddd';x.beginPath();x.moveTo(256,55);x.lineTo(185,175);x.lineTo(327,175);x.fill();x.beginPath();x.moveTo(115,345);x.lineTo(55,450);x.lineTo(175,450);x.fill();x.beginPath();x.moveTo(397,345);x.lineTo(337,450);x.lineTo(457,450);x.fill()}
 if(kind==='yellow'){x.fillStyle='#ffe100';x.fillRect(0,0,512,512);x.fillStyle='#111';x.font='700 92px Arial';x.fillText('3',35,105);x.font='700 38px Arial';x.fillText('KM',120,74);x.fillStyle='#fff';x.beginPath();x.ellipse(270,320,92,130,-.2,0,Math.PI*2);x.ellipse(330,210,50,120,.5,0,Math.PI*2);x.fill();x.fillStyle='#ff7530';x.fillRect(0,455,512,57);x.strokeStyle='#fff';x.lineWidth=24;for(let i=-40;i<560;i+=82){x.beginPath();x.moveTo(i,512);x.lineTo(i+35,455);x.stroke()}}
 if(kind==='blue'){x.fillStyle='#314df4';x.fillRect(0,0,512,512);x.strokeStyle='#fff';x.lineWidth=46;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(105,180);x.lineTo(256,292);x.lineTo(407,180);x.stroke();x.beginPath();x.moveTo(105,180);x.lineTo(105,350);x.lineTo(407,350);x.lineTo(407,180);x.stroke()}
 if(kind==='geometry'){x.fillStyle='#0877d7';x.fillRect(0,0,512,512);x.fillStyle='#ffff2d';x.beginPath();x.moveTo(48,110);x.lineTo(290,256);x.lineTo(48,402);x.fill();circle('#fff',370,256,65);x.fillStyle='#ff7738';x.fillRect(450,100,45,312)}
 if(kind==='safe'){x.fillStyle='#ef2b0c';x.fillRect(0,0,512,512);x.strokeStyle='#fff';x.lineWidth=22;x.strokeRect(38,38,436,436);x.fillStyle='#fff';x.font='500 110px Arial';x.textAlign='center';x.fillText('SAFE',256,300)}
 if(kind==='fire'){x.fillStyle='#ff2e32';x.fillRect(0,0,512,512);x.strokeStyle='#fff';x.lineWidth=34;x.beginPath();x.arc(256,256,188,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.beginPath();x.moveTo(260,400);x.bezierCurveTo(120,360,175,230,220,185);x.lineTo(190,85);x.bezierCurveTo(315,160,260,220,325,265);x.bezierCurveTo(380,335,340,400,260,400);x.fill();x.strokeStyle='#ff2e32';x.lineWidth=28;x.beginPath();x.moveTo(140,100);x.lineTo(385,410);x.stroke()}
 if(kind==='alert'){x.fillStyle='#22cd29';x.fillRect(0,0,512,512);x.fillStyle='#0c4c24';x.beginPath();x.moveTo(256,72);x.lineTo(450,420);x.lineTo(62,420);x.closePath();x.fill();x.fillStyle='#fff';x.font='700 240px Arial';x.textAlign='center';x.fillText('!',256,385)}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

function faceGeo(s){const g=new THREE.ShapeGeometry(shapeFor(s.shape,s.w,s.h),48),p=g.attributes.position,u=g.attributes.uv;for(let i=0;i<p.count;i++){u.setXY(i,p.getX(i)/s.w+.5,p.getY(i)/s.h+.5)}u.needsUpdate=true;return g}

const edgeColors={cyan:0x35c8e2,greenSolid:0x4ca850,greenMid:0x2f7d43,orange:0xf5f5f5,leafKite:0x0e4a1d,leaf:0x12632c,rabbit:0xf2d400,blue:0x2c46e0,redStar:0xe0282c,fire:0xf22d31,minus:0x4ca850,arrowLeaf:0xe6f026,cyanSolid:0x35c8e2};
const clickables=[];
signs.forEach((s,i)=>{
  const arm=new THREE.Group();arm.position.y=s.y;arm.rotation.y=s.angle;rig.add(arm);
  const dir=s.side||1,len=s.len||.3,barMat=s.gray?grayMat:s.dark?stemDarkMat:petioleMat;
  const half=s.w/2;
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(s.gray? .065 : .05,.075,len,10),barMat);
  bar.rotation.z=Math.PI/2;bar.position.x=dir*(len/2+.05);arm.add(bar);
  if(s.bent){const b2=new THREE.Mesh(new THREE.CylinderGeometry(.055,.08,.36,8),stemDarkMat);
   b2.position.set(dir*.14,.05,0);b2.rotation.z=dir>0?-.78:.78;arm.add(b2)}
  const sign=new THREE.Group();sign.position.set(dir*(len+.04+half),0,s.zoff||0);sign.userData.baseZ=s.zoff||0;
  sign.rotation.y=s.showFront===false?Math.PI:0;if(s.tilt)sign.rotation.z=s.tilt;
  arm.add(sign);
  const edgeMat=new THREE.MeshStandardMaterial({color:edgeColors[s.k]??0x12632c,roughness:.85,metalness:0});
  const rimGeo=new THREE.ExtrudeGeometry(shapeFor(s.shape,s.w,s.h,.05),{depth:.12,bevelEnabled:true,bevelSize:.022,bevelThickness:.022,bevelSegments:4,curveSegments:48});rimGeo.center();
  const rim=new THREE.Mesh(rimGeo,edgeMat);sign.add(rim);
  const bodyGeo=new THREE.ExtrudeGeometry(shapeFor(s.shape,s.w,s.h),{depth:.13,bevelEnabled:true,bevelSize:.015,bevelThickness:.015,bevelSegments:3,curveSegments:48});bodyGeo.center();
  const body=new THREE.Mesh(bodyGeo,edgeMat);sign.add(body);
  const front=new THREE.Mesh(faceGeo(s),new THREE.MeshStandardMaterial({map:tex(s.k),transparent:true,alphaTest:.02,roughness:.9,metalness:0}));
  front.position.z=.088;front.scale.setScalar(1.02);sign.add(front);
  const back=new THREE.Mesh(faceGeo(s),new THREE.MeshStandardMaterial({map:tex(s.bk),transparent:true,alphaTest:.02,roughness:.92,metalness:0}));
  back.position.z=-.088;back.rotation.y=Math.PI;back.scale.setScalar(1.07);sign.add(back);
  if(s.berry){const br=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),berryMat);
   br.position.set(s.berry[0],s.berry[1],.04);sign.add(br);
   [br].forEach(o=>{o.userData.sign=sign;o.userData.idx=i;clickables.push(o)})}
  [rim,body,front,back].forEach(o=>{o.userData.sign=sign;o.userData.idx=i;clickables.push(o)});
});

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;
controls.target.set(0,.22,0);
controls.minDistance=10;controls.maxDistance=34;
controls.minPolarAngle=controls.maxPolarAngle=Math.PI/2;
controls.update();

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let down={x:0,y:0},focus=null,anim=null,saved=null,mode='idle';
const panel=document.getElementById('detailPanel'),pTitle=document.getElementById('dTitle'),pMeta=document.getElementById('dMeta'),pBody=document.getElementById('dBody');
const ease=t=>1-Math.pow(1-t,3);
const state=()=>({cam:camera.position.clone(),target:controls.target.clone(),rig:rig.position.clone()});
let popObj=null;
function tween(to,done){const from=state(),start=performance.now(),pop=popObj,pz=pop?pop.obj.position.z:0;anim={step(now){const t=Math.min(1,(now-start)/850),e=ease(t);camera.position.lerpVectors(from.cam,to.cam,e);controls.target.lerpVectors(from.target,to.target,e);rig.position.lerpVectors(from.rig,to.rig,e);if(pop)pop.obj.position.z=pz+(pop.tz-pz)*e;camera.lookAt(controls.target);if(t===1){anim=null;done?.()}}}}
function signFrame(sign,dist,rightShift,targetShift){
  const center=new THREE.Vector3();sign.getWorldPosition(center);
  const normal=new THREE.Vector3(0,0,1).applyQuaternion(sign.getWorldQuaternion(new THREE.Quaternion())).normalize();
  const right=new THREE.Vector3().crossVectors(normal,camera.up).negate().normalize();
  const cam=center.clone().addScaledVector(normal,dist).addScaledVector(right,rightShift);
  cam.y=center.y+0.05;
  const target=center.clone().addScaledVector(right,targetShift);
  return{cam,target};
}
function fillPanel(idx){
  const d=details[idx]||details[0];
  pTitle.textContent=d.t;
  pMeta.textContent=d.m;
  pBody.innerHTML=d.b.map(x=>`<p class="db">• ${x}</p>`).join('');
}
function enterDetail(idx,sign){
  if(mode==='idle')saved=state();
  if(popObj&&popObj.obj!==sign){popObj.obj.position.z=popObj.obj.userData.baseZ??0;popObj=null}
  focus=sign;mode='detail';controls.enabled=false;
  fillPanel(idx);
  const dir=signs[idx].side<0?-1:1;
  panel.classList.toggle('side-l',dir<0);
  panel.classList.toggle('side-r',dir>0);
  document.body.classList.add('detail-on');
  popObj={obj:sign,tz:(sign.userData.baseZ??0)+.8};
  const{cam,target}=signFrame(sign,dir<0?5.35:4.9,(dir<0?0.32:0.55)*dir,(dir<0?0.95:1.3)*dir);
  tween({cam,target,rig:rig.position.clone()});
}
function restore(){
  if(!focus||!saved)return;
  const to=saved,back=focus;
  popObj={obj:back,tz:back.userData.baseZ??0};focus=null;mode='idle';
  document.body.classList.remove('detail-on');
  tween(to,()=>{controls.enabled=true;controls.update();saved=null;popObj=null});
}
function pickAt(cx,cy){
  pointer.x=cx/innerWidth*2-1;pointer.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(clickables,false)[0];
}

renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>7||anim)return;
  const hit=pickAt(e.clientX,e.clientY);
  if(hit)enterDetail(hit.object.userData.idx,hit.object.userData.sign);
  else if(mode==='detail')restore();
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  fitBoard();
});

const board=document.querySelector('.board');
function fitBoard(){const s=Math.min(innerWidth/1920,1);board.style.transform=`translateX(-50%) scale(${s})`}
fitBoard();

function loop(now){requestAnimationFrame(loop);if(anim)anim.step(now);else controls.update();renderer.render(scene,camera)}
requestAnimationFrame(loop);
</script>
