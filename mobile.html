function panelShape(type,w,h,g=0){
 const s=new THREE.Shape(),W=w/2+g,H=h/2+g;
 if(type==='circle'){s.absarc(0,0,W,0,Math.PI*2);return s;}
 if(type==='round'){const r=Math.min(W,H)*.18;s.moveTo(-W+r,-H);s.lineTo(W-r,-H);s.quadraticCurveTo(W,-H,W,-H+r);s.lineTo(W,H-r);s.quadraticCurveTo(W,H,W-r,H);s.lineTo(-W+r,H);s.quadraticCurveTo(-W,H,-W,H-r);s.lineTo(-W,-H+r);s.quadraticCurveTo(-W,-H,-W+r,-H);s.closePath();return s;}
 let pts=[[-1,0],[-.66,-.76],[0,-1],[.66,-.76],[1,0],[.66,.76],[0,1],[-.66,.76]];
 if(type==='greenleaf'||type==='arrowpoly')pts=[[-1,0],[-.56,-1],[.56,-1],[1,0],[.56,1],[-.56,1]];
 pts.forEach((p,i)=>{const x=p[0]*W,y=p[1]*H;i?s.lineTo(x,y):s.moveTo(x,y);});
 s.closePath();return s;
}
function panelGeo(type,w,h,g=0){return new THREE.ShapeGeometry(panelShape(type,w,h,g),48);}
function setUV(g,w,h){const p=g.attributes.position,u=g.attributes.uv;for(let i=0;i<p.count;i++)u.setXY(i,p.getX(i)/w+.5,p.getY(i)/h+.5);u.needsUpdate=true;return g;}

 const lx=s.w*.5+.045,ly=s.roll*.28;
 reach.add(barBetween(new THREE.Vector3(0,0,0),new THREE.Vector3(lx,ly,0),.075,.05,branchMat));
 const leaf=new THREE.Group();
 leaf.position.set(lx,ly,0);
 leaf.rotation.set(s.tilt,0,s.roll);
 leaf.userData.baseZ=0;
 reach.add(leaf);
 const bodyGeo=new THREE.ExtrudeGeometry(panelShape(s.type,s.w,s.h),{depth:.13,bevelEnabled:true,bevelSize:.014,bevelThickness:.014,bevelSegments:3,curveSegments:48});
 bodyGeo.center();
 const body=new THREE.Mesh(bodyGeo,new THREE.MeshStandardMaterial({color:col,roughness:.9,metalness:0}));
 leaf.add(body);
 const fg=setUV(panelGeo(s.type,s.w,s.h),s.w,s.h);
 const front=new THREE.Mesh(fg,new THREE.MeshStandardMaterial(s.map?{map:maps[s.map],color:0xffffff,transparent:true,alphaTest:.01,roughness:.94,metalness:0}:{color:col,roughness:.94,metalness:0}));
 front.position.z=.084;leaf.add(front);
 if(s.type==='greenleaf'){
  const symMat=new THREE.MeshStandardMaterial({map:maps['shapes-symbols'],color:0xffffff,transparent:true,alphaTest:.01,roughness:.94,metalness:0});
  const sym=new THREE.Mesh(new THREE.PlaneGeometry(2.06,.79),symMat);
  sym.position.z=.088;leaf.add(sym);
  sym.userData.sign=leaf;sym.userData.idx=i;clickables.push(sym);
  const symB=new THREE.Mesh(new THREE.PlaneGeometry(2.06,.79),symMat);
  symB.position.z=-.088;symB.rotation.y=Math.PI;leaf.add(symB);
  symB.userData.sign=leaf;symB.userData.idx=i;clickables.push(symB);
 }
 if(s.type==='bluepoly'){
  const logoMat=new THREE.MeshStandardMaterial({map:maps['capcut-logo'],color:0xffffff,transparent:true,alphaTest:.01,roughness:.94,metalness:0});
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(1.55,1.21),logoMat);
  logo.position.z=.088;leaf.add(logo);
  logo.userData.sign=leaf;logo.userData.idx=i;clickables.push(logo);
  const logoB=new THREE.Mesh(new THREE.PlaneGeometry(1.55,1.21),logoMat);
  logoB.position.z=-.088;logoB.rotation.y=Math.PI;leaf.add(logoB);
  logoB.userData.sign=leaf;logoB.userData.idx=i;clickables.push(logoB);
 }
 if(s.type==='arrowpoly'){
  const arMat=new THREE.MeshStandardMaterial({map:maps['arrow-g'],color:0xffffff,transparent:true,alphaTest:.01,roughness:.94,metalness:0});
  const ar=new THREE.Mesh(new THREE.PlaneGeometry(s.w,s.h),arMat);
  ar.position.z=.088;ar.rotation.z=-.386;leaf.add(ar);
  ar.userData.sign=leaf;ar.userData.idx=i;clickables.push(ar);
  const arB=new THREE.Mesh(new THREE.PlaneGeometry(s.w,s.h),arMat);
  arB.position.z=-.088;arB.rotation.set(0,Math.PI,Math.PI-.386);leaf.add(arB);
  arB.userData.sign=leaf;arB.userData.idx=i;clickables.push(arB);
 }
 const rear=new THREE.Mesh(fg,new THREE.MeshStandardMaterial(s.map?{map:maps[s.map],color:0xffffff,transparent:true,alphaTest:.01,roughness:.94,metalness:0}:{color:col,roughness:.95,metalness:0}));
 rear.position.z=-.084;rear.rotation.y=Math.PI;leaf.add(rear);
 [body,front,rear].forEach(o=>{o.userData.sign=leaf;o.userData.idx=i;clickables.push(o);});
 if(s.bud){
  const bud=new THREE.Mesh(new THREE.SphereGeometry(.12,20,16),budMat);
  bud.position.set(s.w+.185,ly,0);
  reach.add(bud);
 }
});

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;
controls.target.set(0,.22,0);
controls.minDistance=10;controls.maxDistance=34;
controls.minPolarAngle=controls.maxPolarAngle=Math.PI/2;
controls.autoRotate=true;controls.autoRotateSpeed=.7;
controls.update();
renderer.domElement.addEventListener('pointerdown',()=>{controls.autoRotate=false;});

/* ===== 点按路牌 → 底部弹层 ===== */
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let down={x:0,y:0},focus=null,anim=null,saved=null,mode='idle',popObj=null;
const hero=document.getElementById('hero'),mSheet=document.getElementById('mSheet'),
      mTitle=document.getElementById('mTitle'),mMeta=document.getElementById('mMeta'),mBody=document.getElementById('mBody');
const ease=t=>1-Math.pow(1-t,3);
const state=()=>({cam:camera.position.clone(),target:controls.target.clone(),rig:rig.position.clone()});
function tween(to,done){const from=state(),start=performance.now(),pop=popObj,pz=pop?pop.obj.position.z:0;anim={step(now){const t=Math.min(1,(now-start)/850),e=ease(t);camera.position.lerpVectors(from.cam,to.cam,e);controls.target.lerpVectors(from.target,to.target,e);rig.position.lerpVectors(from.rig,to.rig,e);if(pop)pop.obj.position.z=pz+(pop.tz-pz)*e;camera.lookAt(controls.target);if(t===1){anim=null;done?.();needsRender=true;}}};needsRender=true;}
function signFrame(sign,dist,rightShift,targetShift){
 const center=new THREE.Vector3();sign.getWorldPosition(center);
 const normal=new THREE.Vector3(0,0,1).applyQuaternion(sign.getWorldQuaternion(new THREE.Quaternion())).normalize();
 const right=new THREE.Vector3().crossVectors(normal,camera.up).negate().normalize();
 const cam=center.clone().addScaledVector(normal,dist).addScaledVector(right,rightShift);
 cam.y=center.y+0.05;
 const target=center.clone().addScaledVector(right,targetShift);
 return{cam,target};
}
function fillSheet(idx){
 const d=details[idx]||details[0];
 mTitle.textContent=d.t;mMeta.textContent=d.m;
 mBody.innerHTML=d.b.map(x=>`<p>• ${x}</p>`).join('');
}
function enterDetail(idx,sign){
 if(mode==='idle')saved=state();
 if(popObj&&popObj.obj!==sign){popObj.obj.position.z=popObj.obj.userData.baseZ??0;popObj=null;}
 focus=sign;mode='detail';controls.enabled=false;
 fillSheet(leaves[idx].ci);
 hero.classList.add('sheet-on');
 popObj={obj:sign,tz:(sign.userData.baseZ??0)+.8};
 const dir=leaves[idx].side<0?-1:1;
 const{cam,target}=signFrame(sign,dir<0?5.35:4.9,(dir<0?0.32:0.55)*dir,(dir<0?0.95:1.3)*dir);
 tween({cam,target,rig:rig.position.clone()});
}
function restore(){
 if(!focus||!saved)return;
 const to=saved,back=focus;
 popObj={obj:back,tz:back.userData.baseZ??0};focus=null;mode='idle';
 hero.classList.remove('sheet-on');
 tween(to,()=>{controls.enabled=true;controls.update();saved=null;popObj=null;});
}
function pickAt(cx,cy){
 pointer.x=cx/innerWidth*2-1;pointer.y=-(cy/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 return raycaster.intersectObjects(clickables,false)[0];
}
document.getElementById('mSheetClose').addEventListener('click',e=>{e.stopPropagation();restore();});
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{
 if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>8||anim)return;
 const hit=pickAt(e.clientX,e.clientY);
 if(hit)enterDetail(hit.object.userData.idx,hit.object.userData.sign);
 else if(mode==='detail')restore();
});

/* ===== PDF.js 查看器（与桌面版同源） ===== */
const pdfBackdrop=document.getElementById('pdfBackdrop'),pdfScroll=document.getElementById('pdfScroll'),
      pdfWin=pdfBackdrop.querySelector('.pdf-win'),
      pdfTitle=document.getElementById('pdfTitle'),pdfExt=document.getElementById('pdfExt');
let pdfToken=0,idleTimer=null;const pdfDocs={};
function wakeBar(){pdfWin.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>pdfWin.classList.add('idle'),1800);}
pdfWin.addEventListener('pointerdown',wakeBar);
function openPdf(file,title){
 const token=++pdfToken;
 pdfTitle.textContent=title||file;
 pdfExt.href='pdfs/'+file;
 pdfBackdrop.classList.add('open');
 document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';
 pdfWin.classList.remove('idle');wakeBar();
 showPdf(file,token);
}
function closePdf(){
 pdfBackdrop.classList.remove('open');
 document.documentElement.style.overflow='';document.body.style.overflow='';
 pdfWin.classList.remove('idle');clearTimeout(idleTimer);
 pdfToken++;
 setTimeout(()=>{if(!pdfBackdrop.classList.contains('open'))pdfScroll.innerHTML='';},300);
}
document.getElementById('pdfClose').addEventListener('click',closePdf);
pdfBackdrop.addEventListener('click',e=>{if(e.target===pdfBackdrop)closePdf();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&pdfBackdrop.classList.contains('open'))closePdf();});
let pdfJsPromise=null;
function loadPdfJs(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(pdfJsPromise)return pdfJsPromise;
 pdfJsPromise=new Promise((res,rej)=>{
  const s=document.createElement('script');
  s.src='vendor/pdf.min.js';
  s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';res(window.pdfjsLib);};
  s.onerror=rej;
  document.head.appendChild(s);
 });
 return pdfJsPromise;
}
async function showPdf(file,token){
 pdfScroll.innerHTML='<div class="pdf-loading">作品加载中…</div>';
 try{
  const pdfjs=await loadPdfJs();
  if(token!==pdfToken)return;
  let doc=pdfDocs[file];
  if(!doc){
   const buf=await (await fetch('pdfs/'+file)).arrayBuffer();
   if(token!==pdfToken)return;
   doc=await pdfjs.getDocument({data:buf,disableRange:true,disableStream:true}).promise;
   pdfDocs[file]=doc;
  }
  if(token!==pdfToken)return;
  pdfScroll.innerHTML='';
  let contW=pdfScroll.clientWidth;
  const pages=[];
  for(let n=1;n<=doc.numPages;n++){
   const page=await doc.getPage(n);
   const base=page.getViewport({scale:1});
   const el=document.createElement('div');
   el.className='pdf-page';el.dataset.page=n;
   el.style.width=contW+'px';
   el.style.height=Math.round(contW*base.height/base.width)+'px';
   pdfScroll.appendChild(el);
   pages.push({el,page,base});
  }
  const contW2=pdfScroll.clientWidth;
  if(contW2&&contW2!==contW){
   contW=contW2;
   pages.forEach(({el,base})=>{el.style.width=contW+'px';el.style.height=Math.round(contW*base.height/base.width)+'px';});
  }
  pdfScroll.scrollTop=0;
  const dpr=Math.min(devicePixelRatio||1,2);
  const io=new IntersectionObserver(es=>{
   es.forEach(async en=>{
    if(!en.isIntersecting)return;
    const p=en.target._p;if(!p||p.el.querySelector('canvas'))return;
    const vp=p.page.getViewport({scale:contW/p.base.width*dpr});
    const c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    p.el.style.height='auto';
    p.el.appendChild(c);
    try{await p.page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;}catch(e){}
   });
  },{root:pdfScroll,rootMargin:'600px 0px'});
  pages.forEach(p=>{p.el._p=p;io.observe(p.el);});
 }catch(err){
  if(token!==pdfToken)return;
  pdfScroll.innerHTML='<iframe class="pdf-fallback" src="pdfs/'+file+'"></iframe>';
 }
}

/* ===== 渲染循环（按需） ===== */
let needsRender=true;
controls.addEventListener('change',()=>needsRender=true);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);needsRender=true;
});
function loop(now){
 requestAnimationFrame(loop);
 if(anim){anim.step(now);needsRender=true;}else controls.update();
 if(needsRender){renderer.render(scene,camera);needsRender=false;}
}
requestAnimationFrame(loop);
